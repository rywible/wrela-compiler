[package]
name = "wrela-host"
description = "The native host: runs a built wrela program's WASM (wasmtime) and command stream (wgpu), headless"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wrela-host"
path = "src/main.rs"
test = false

[features]
default = ["gpu"]
# The GPU: `Host`, which runs the command stream under wgpu. Without it, the crate is
# `CpuHost` alone, which the compiler uses to run a program's frames for its tests.
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
wrela-abi.workspace = true
# Chrome over the DevTools protocol: `std::tool::browser`, and the tests' pages (`pages`).
wrela-chrome.workspace = true
wasmtime.workspace = true
# The tool host's files: directory-relative handles, so no path or symbolic link leaves a root.
cap-std = "4"
# `O_NONBLOCK`, so opening a tool's file never waits on a FIFO; process groups for `run`.
libc = "0.2"
# `std::tool::run`'s process groups, killed without `unsafe`, and files opened through a directory
# handle without following a link (`confined`); already in the tree, for cap-std.
rustix = { version = "1", features = ["process", "fs"] }
# `std::tool::http`'s client: blocking, on the tool host's worker threads, over rustls.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# `std::tool::image`: PNG (already the GPU host's, for frames), JPEG, and WebP through libwebp,
# which decodes it and encodes it lossily, as Pillow does (docs/citations.md).
png = "0.18"
# Without its SIMD paths, so a JPEG decodes to the same pixels on every machine.
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
zune-core = "0.5"
webp = { version = "0.3", default-features = false }
# Compiled code's names in the code cache (`code`), and the drive service's builds by their
# WASM: SHA-256, already the CLI's.
sha2 = "0.10"
# A server's store (`services`): SQLite, built in, so the host needs no system library.
rusqlite = { version = "0.37", features = ["bundled"] }
# A server's signature checks and randomness (`services`): the RustCrypto and dalek crates, so
# no cryptography is written here.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
getrandom = "0.3"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"], optional = true }
pollster = { version = "0.4", optional = true }

[dev-dependencies]
wat = "1.260"
# A seeded generator for the RSA key a test signs with.
rand_chacha = "0.3"

[lints]
workspace = true
