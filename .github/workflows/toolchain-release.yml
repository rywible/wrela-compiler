# Builds a toolchain release for each pushed tag `vX.Y.Z` (tools/package.py) on Linux x86-64 and
# macOS arm64, and publishes the tarballs and one SHA256SUMS as the tag's GitHub release: what
# `wrela` downloads for a workspace that pins `toolchain = "X.Y.Z"` (spec/language.md §3.6). It
# only builds and publishes: every check stays local (tools/check.sh). It belongs to
# rywible/wrela-compiler and runs there alone; the tag must be Cargo's version. Where a tag can't
# be pushed, a run started by hand on `main` with the version (`workflow_dispatch`) does the same,
# the release making the tag `vX.Y.Z` at the commit it built.
name: Toolchain release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, X.Y.Z: Cargo's on main"
        required: true
        type: string

permissions:
  contents: read

# The release's tag: the one pushed, or `v` and the version given by hand.
env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  build:
    if: github.repository == 'rywible/wrela-compiler'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Package
        run: python3 tools/package.py --version "${TAG#v}" --target "${{ matrix.target }}" --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.repository == 'rywible/wrela-compiler'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "The wrela toolchain ${TAG#v}: wrela, wrela-host, wrela-serve and Binaryen's wasm-opt for each target. A workspace pins it with toolchain = \"${TAG#v}\"." \
            *.tar.gz SHA256SUMS
